  const adm=isAdm();ROSTER=await q(sb.from('profiles').select('*').order('name'));
  EMAILS={};if(adm){const r=await sb.rpc('admin_emails');(r.data||[]).forEach(x=>EMAILS[x.id]=x.email)}
  const rows=ROSTER.map(p=>`<div class="li"><div class="who2"><b>${adm?`<i class="odot${ONLINE.has(p.id)?' on':''}" data-uid="${p.id}" role="img" aria-label="${ONLINE.has(p.id)?'Online now':'Offline'}" title="${ONLINE.has(p.id)?'Online now':'Offline'}"></i>`:''}${esc(p.name)}</b>${adm&&EMAILS[p.id]?`<span class="mu">${esc(EMAILS[p.id])}</span>`:''}</div>
    <div class="meta mu">${esc(p.tz)}<br>${lim(p)}</div>${p.badge&&p.approved?`<span class="stat chip dev">${esc(p.badge)}</span>`:`<span class="stat chip ${p.approved?'approved':'pending'}">${p.approved?(p.role==='admin'?'Admin':'Driver'):'Waiting'}</span>`}${p.site_editor&&p.role!=='admin'?'<span class="stat chip ed">Editor</span>':''}
    ${adm?`<div class="acts">${p.approved?'':`<button class="pri" onclick="setUser('${p.id}',true,'driver')">Approve</button>`}<button class="ghost" onclick="profDlg('${p.id}')">Edit</button>${p.id!==me.id&&p.approved?`<button class="ghost" onclick="setUser('${p.id}',true,'${p.role==='admin'?'driver':'admin'}')">${p.role==='admin'?'Make driver':'Make admin'}</button>${p.role!=='admin'?`<button class="ghost" onclick="setEditor('${p.id}',${!p.site_editor})">${p.site_editor?'Remove editor':'Make editor'}</button>`:''}<button class="ghost" onclick="setUser('${p.id}',false,'driver')" title="Blocks access but keeps the account; approve again to undo">Suspend</button>`:''}${p.id!==me.id?`<button class="danger" onclick="delUser('${p.id}')">Remove</button>`:''}</div>`:''}</div>`).join('');
  $('#main').innerHTML=`<h1 class="lt">Roster</h1><p class="lt-sub">${ROSTER.filter(p=>p.approved).length} drivers${ROSTER.some(p=>!p.approved)?` · ${ROSTER.filter(p=>!p.approved).length} waiting for approval`:''}</p><h3>Your profile</h3><div class="card langcard"><span class="grow">Language · Γλώσσα</span><div class="seg" role="group" aria-label="Language"><button type="button" class="${LANG==='en'?'on':''}" onclick="setLang('en')">English</button><button type="button" class="${LANG==='el'?'on':''}" onclick="setLang('el')">Ελληνικά</button></div></div><form id="pf" class="card form" onsubmit="saveProf(event)" oninput="this.dataset.changed=1" onchange="this.dataset.changed=1">
    ${profFields(prof)}<button class="pri">Save profile</button>${DEV_TZ!==prof.tz?`<button type="button" onclick="this.form.querySelector('[name=tz]').value='${esc(DEV_TZ)}';this.form.dataset.changed=1">Use this device’s zone (${esc(DEV_TZ)})</button>`:''}</form>
    <p class="mu">Your time zone is taken from your device on first login. Change it here if it’s wrong.</p>
    ${siteProfCard()}
    <h3>Drivers</h3><div class="card flush">${rows}</div>${adm?'<p class="mu">Only admins see emails and these buttons. Suspend blocks a driver but keeps their account (approve again to undo). Remove deletes the driver for good.</p>':''}
    <div class="row" style="margin-top:28px"><button onclick="pwDlg()">Change password</button><button class="danger" onclick="sb.auth.signOut()">Sign out</button></div>`}
async function saveProf(e){e.preventDefault();const row=profRow(new FormData(e.target));
  await q(sb.from('profiles').update(row).eq('id',me.id));store.set('nameok:'+me.id,row.name);
  delete e.target.dataset.changed;await start();note('Profile saved.',1)}
function profDlg(id){const p=ROSTER.find(x=>x.id===id);if(!p)return;const self=id===me.id;
  openDlg(`<form onsubmit="saveProfOf(event,'${p.id}')"><h3>Edit ${esc(p.name)}</h3>${profFields(p)}
    <label>Email<input name="email" type="email" required value="${esc(EMAILS[p.id]||'')}" autocomplete="off"></label>
    <div class="row"><button class="pri">Save</button><button type="button" onclick="closeDlg()">Cancel</button></div></form>
    ${self?'':`<div class="pwbox"><h3 style="font-size:17px">Reset password</h3>
    <p class="mu" style="margin:0">Set a simple temporary password and send it to ${esc(p.name)}. They sign in with it and must pick their own straight away.</p>
    <div class="add-row" style="grid-template-columns:1fr 1fr;margin-top:10px"><label style="grid-column:1 / -1">Temporary password<input id="tmppw" minlength="6" autocomplete="off" spellcheck="false"></label>
    <button type="button" onclick="$('#tmppw').value=tempPw()">Generate</button><button type="button" class="pri" onclick="setTempPw('${p.id}')">Set password</button></div></div>`}`)}
// Easy to read out or type: word-word-4 digits, no look-alike characters.
function tempPw(){const w=['spa','monza','fuji','sebring','imola','lemans','qatar','bahrain','pitlane','apex','hypercar','podium'],r=n=>crypto.getRandomValues(new Uint32Array(1))[0]%n;
  return `${w[r(w.length)]}-${w[r(w.length)]}-${1000+r(9000)}`}
async function setTempPw(id){const pw=$('#tmppw').value.trim(),p=ROSTER.find(x=>x.id===id);
  if(pw.length<6)return note('Use at least 6 characters.');
  const {error}=await sb.rpc('admin_set_password',{uid:id,pw});if(error)return note(error.message);
  closeDlg();note(`Temporary password set for ${p.name}. Send it to them; they’ll choose their own at next sign-in.`,1)}
async function saveProfOf(e,id){e.preventDefault();const f=new FormData(e.target),row=profRow(f),em=String(f.get('email')||'').trim().toLowerCase();
  if(em&&em!==(EMAILS[id]||'').toLowerCase()){const {error}=await sb.rpc('admin_set_email',{uid:id,new_email:em});if(error)return note(error.message)}
  const r=await q(sb.from('profiles').update(row).eq('id',id).select());
  if(!r||!r.length)return note('Not saved. Run the latest database update so admins can edit drivers.');
  closeDlg();if(id===me.id){store.set('nameok:'+me.id,row.name);await start();go('roster')}else{await loadBase();render()}note('Driver updated.',1)}
async function delUser(id){const p=ROSTER.find(x=>x.id===id);if(!p)return;
  if(!await askO({danger:true,ok:'Remove permanently'})(`Remove ${p.name} permanently?\n\nThis deletes their login, availability, team places and stints. It can’t be undone.\n\nTo only block access for now, use Suspend instead.`))return;
  const {error}=await sb.rpc('admin_delete_user',{uid:id});if(error)return note(error.message);
  await loadBase();render();note(`${p.name} was removed.`,1)}
async function setUser(id,ok,role){await q(sb.rpc('set_user',{uid:id,ok,r:role}));await loadBase();render()}

boot();
</script>
</body>
