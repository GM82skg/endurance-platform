<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Endurance Crew</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#12151a;--pn:#1b2028;--bd:#2a313c;--mu:#9aa3b2;--am:#ffb020;--g:#2f9e63;--y:#d4a017;--r:#b5483f;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#e8eaed;font:14px system-ui,sans-serif}
header{display:flex;align-items:center;gap:12px;padding:6px 20px;min-height:56px;background:var(--pn);border-bottom:1px solid var(--bd);flex-wrap:wrap;position:sticky;top:0;z-index:5}
header b.brand{color:var(--am);letter-spacing:2px}header nav{display:flex;gap:6px;flex-wrap:wrap}header nav button.on{background:var(--am);color:var(--bg);border-color:var(--am)}
.grow{flex:1}.mu{color:var(--mu);font-size:12px}.am{color:var(--am)}
main{max-width:1200px;margin:0 auto;padding:20px}h2{margin:0 0 8px;font-size:24px}h3{margin:18px 0 8px;font-size:16px}
button,select,input{font:inherit;color:inherit;min-height:44px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);padding:6px 12px}
button{cursor:pointer;font-weight:700;background:transparent}button.pri{background:var(--am);color:var(--bg);border:0}button.ghost{color:var(--mu)}button.danger{color:#ff8a80;border-color:#5a2a26}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--am);outline-offset:2px}
label{display:flex;flex-direction:column;gap:4px;color:var(--mu);font-size:12px}
.card{background:var(--pn);border:1px solid var(--bd);border-radius:12px;padding:14px 18px;margin-bottom:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.len{font-size:24px;color:var(--am);width:64px;font-weight:700}
.form{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.tabs{display:flex;gap:6px;margin:12px 0}.tabs button.on{background:var(--am);color:var(--bg);border:0}
.chip{display:inline-block;padding:3px 10px;border-radius:99px;font-size:11px;font-weight:700;background:#1f4d8f;color:#fff;white-space:nowrap}
.chip.approved,.chip.ok{background:#1f6b43}.chip.pending,.chip.warn{background:#7a5a00}.chip.bad{background:#8f2f28}.chip.dim{background:#2a313c;color:var(--mu)}
.banner{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-left:4px solid var(--am);background:#2a2412;padding:8px 14px;border-radius:8px;margin:8px 0}
.banner.warn{border-color:var(--r);background:#2a1715}.banner.ok{border-color:var(--g);background:#14261c}
.banner button{min-height:36px;padding:4px 10px}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:separate;border-spacing:3px}
.av th{font-size:11px;font-weight:400;color:var(--mu);text-align:center;min-width:38px;vertical-align:bottom;padding:0 0 2px}
.av td{vertical-align:middle}.av td:first-child,.av th:first-child{text-align:left;min-width:130px;max-width:130px;position:sticky;left:0;background:var(--bg);z-index:1}
.av tr.me td:first-child{color:var(--am)}.n{text-align:center;font-weight:700}.n.zero{color:#ff8a80}
.day{display:block;color:var(--am);font-weight:700}
.dst{box-shadow:inset 3px 0 var(--am)}.dstl{display:block;color:var(--am);font-weight:700;font-size:10px}
.cell{display:block;width:100%;min-width:34px;height:34px;min-height:0;padding:0;border:0;border-radius:4px}
.A{background:var(--g)}.M{background:var(--y)}.N{background:var(--r)}.u{background:#2a313c}
.tl{display:grid;grid-template-columns:150px repeat(var(--L),minmax(36px,1fr));gap:2px;align-items:stretch;min-width:calc(150px + var(--L) * 38px)}
.tl .who{position:sticky;left:0;background:var(--pn);z-index:3;padding-right:8px;display:flex;flex-direction:column;justify-content:center;min-height:40px;overflow:hidden}
.tl .who button{min-height:0;padding:0;border:0;text-align:left;font-weight:700}
.tl .ax{font-size:10px;color:var(--mu);text-align:center;align-self:end;padding-bottom:2px}
.tl .h{min-height:40px;border:0;border-radius:4px;padding:0}
.tl .h.A{background:#1d4a33}.tl .h.M{background:#5a4a0f}.tl .h.N{background:#4a2420}.tl .h.u{background:#252b35}
.tl button.h:hover{outline:1px solid var(--am)}
.tl .cov{min-height:12px;border-radius:3px;align-self:center}.cov.ok{background:var(--g)}.cov.p{background:var(--y)}.cov.gap{background:var(--r)}
.cov.x{background:repeating-linear-gradient(45deg,#c2453b 0 4px,#5a1f1a 4px 8px)}
.tl .bar{z-index:2;margin:5px 2px;min-height:0;border:0;border-radius:6px;padding:0 8px;font-size:12px;color:#fff;background:#1f6b43;white-space:nowrap;overflow:hidden;text-align:left}
.tl .bar.pending{background:#7a5a00}.tl .bar:hover{outline:2px solid #fff}
.legend{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap;align-items:center}
.list td{padding:4px 8px;white-space:nowrap}
.auth{max-width:380px;margin:12vh auto;padding:0 20px}.auth form{display:flex;flex-direction:column;gap:14px}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#7a2f28;color:#fff;padding:10px 16px;border-radius:8px;max-width:90vw;z-index:9}
#toast.ok{background:#1f6b43}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--mu)}.live i{width:9px;height:9px;border-radius:50%;background:#59606b}.live.on i{background:var(--g)}
dialog{background:var(--pn);color:inherit;border:1px solid var(--bd);border-radius:12px;padding:18px;width:min(520px,calc(100vw - 24px));max-height:calc(100vh - 24px)}
dialog::backdrop{background:#000a}dialog form{display:flex;flex-direction:column;gap:12px}dialog h3{margin:0}
#dmsg{color:#ff8a80;font-size:13px}#dmsg:empty{display:none}
.plan td{padding:3px 8px}
details summary{cursor:pointer;color:var(--mu);padding:8px 0}
.stint{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:6px 0;border-top:1px solid var(--bd)}
@media (max-width:640px){
  header{padding:6px 12px;gap:8px}main{padding:12px}h2{font-size:20px}.len{width:48px;font-size:20px}
  .card{padding:12px}.tl{grid-template-columns:104px repeat(var(--L),36px);min-width:0}
  .av td:first-child,.av th:first-child{min-width:96px;max-width:96px}
}
</style>
</head>
<body>
<div id="app"></div>
<dialog id="dlg"></dialog>
<script>
const CFG={url:'https://isuiksufkyishdowejob.supabase.co',key:'sb_publishable_DMqGCrW9YEmzEN2_cP67-w_ljr1JBo9'};
const sb=supabase.createClient(CFG.url,CFG.key);
const CARS={
Hypercar:['Alpine A424','Aston Martin Valkyrie','BMW M Hybrid V8','Cadillac V-Series.R','Ferrari 499P','Genesis GMR-001','Glickenhaus SCG 007','Isotta Tipo 6','Lamborghini SC63','Peugeot 9x8','Peugeot 9x8 Evo','Porsche 963','Toyota GR010','Vanwall Vandervell 680'],
LMP2:['Oreca 07 (ELMS)','Oreca 07 (WEC)'],
LMP3:['ADESS AD25','Duqueine D09','Ginetta G61-LT-P325-Evo','Ligier JS P325'],
GT3:['Aston Martin Vantage AMR','BMW M4','Corvette Z06 GT3.R','Ferrari 296','Ford Mustang','Lamborghini Huracan Evo2','Lexus RC F','McLaren 720S Evo','Mercedes-AMG','Porsche 911 GT3 R'],
GTE:['Aston Martin Vantage AMR','Corvette C8.R','Ferrari 488 GTE Evo','Porsche 911 RSR-19']};
const TRACKS=['Bahrain','Barcelona','COTA','Daytona','Fuji','Imola','Interlagos','Laguna Seca','Le Mans','Long Beach','Monza','Paul Ricard','Portimao','Qatar','Road Atlanta','Sebring','Silverstone','Spa'];
const VERSION='2.1',H=3600000,STINTS=[2,3],$=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const WORD={A:'available',M:'maybe',N:'no','-':'not set'},COVW={ok:'covered',p:'covered (pending)',gap:'no driver',x:'two stints overlap'};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store={get(k){try{return localStorage.getItem(k)}catch{return null}},set(k,v){try{localStorage.setItem(k,v)}catch{}}};

/* ---------- time ---------- */
const tzOK=tz=>{try{new Intl.DateTimeFormat('en',{timeZone:tz});return !!tz}catch{return false}};
const DEV_TZ=(()=>{try{const z=Intl.DateTimeFormat().resolvedOptions().timeZone;return tzOK(z)?z:'UTC'}catch{return 'UTC'}})();
const myTz=()=>tzOK(prof?.tz)?prof.tz:'UTC';
const utcHM=d=>d.toISOString().slice(11,16);
const utcFull=d=>d.toISOString().slice(0,16).replace('T',' ')+' UTC';
const locH=(d,tz)=>new Intl.DateTimeFormat('en-GB',{timeZone:tz,hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).format(d);
const locDay=(d,tz)=>new Intl.DateTimeFormat('en-GB',{timeZone:tz,weekday:'short'}).format(d);
const locFull=(d,tz)=>new Intl.DateTimeFormat('en-GB',{timeZone:tz,weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).format(d);
const range=(a,n,tz)=>`${locH(a,tz)}–${locH(new Date(+a+n*H),tz)}`;
// "Sat 19:30–22:30", or "Sat 19:30–Sun 18:30" when it crosses midnight
const span=(a,n,tz)=>{const b=new Date(+a+n*H),d1=locDay(a,tz),d2=locDay(b,tz);return `${d1} ${locH(a,tz)}–${d2!==d1?d2+' ':''}${locH(b,tz)}`};
const zParts=(d,tz)=>Object.fromEntries(new Intl.DateTimeFormat('en-US',{timeZone:tz,hourCycle:'h23',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'}).formatToParts(d).map(x=>[x.type,x.value]));
const zOff=(d,tz)=>{const p=zParts(d,tz);return Date.UTC(+p.year,p.month-1,+p.day,+p.hour,+p.minute,+p.second)-Math.floor(d/1000)*1000};
// datetime-local value <-> moment, read in the profile's time zone (not the computer's).
const toInput=(d,tz)=>{const p=zParts(d,tz);return `${p.year}-${p.month}-${p.day}T${p.hour}:${p.minute}`};
const fromInput=(v,tz)=>{const [y,mo,da,h,mi]=v.split(/[-T:]/).map(Number),w=Date.UTC(y,mo-1,da,h,mi);let t=w;for(let i=0;i<3;i++)t=w-zOff(new Date(t),tz);return new Date(t)};
const rel=d=>{const m=(d-Date.now())/60000;if(m<0)return 'started';if(m<60)return `in ${Math.round(m)} min`;if(m<48*60)return `in ${Math.round(m/60)} h`;return `in ${Math.round(m/1440)} days`};
// Columns where the clocks change in a time zone: {column: shift in minutes (+60 forward, -60 back)}
function clockMarks(start,L,tz){const m={};let prev=zOff(start,tz);for(let i=1;i<=L;i++){const o=zOff(new Date(+start+i*H),tz);if(o!==prev){m[i<L?i:L-1]=(o-prev)/60000;prev=o}}return m}
function clockNotes(start,L){
  const out=[],tzs=[...new Set([myTz(),...profiles.map(p=>p.tz)])].filter(tzOK);
  tzs.forEach(tz=>Object.entries(clockMarks(start,L,tz)).forEach(([i,m])=>{const t=new Date(+start+i*H),h=Math.abs(m)/60;
    out.push(`${tz===myTz()?`Your time zone (${tz})`:tz}: clocks go ${m<0?'back':'forward'} ${h}h during this race, so ${m<0?'an hour repeats':'an hour is skipped'} around ${locH(t,tz)} local.`)}));
  return out}

/* ---------- state ---------- */
let me=null,prof=null,profiles=[],races=[],view='my',raceId=null,sub='avail',AV={},AVT={},T={ts:[],ms:[],ss:[]},PLAN=null;
let busy=0,chan=null,dirty=false,rt=null,tt,lastKey='';
const isAdm=()=>prof?.role==='admin',curRace=()=>races.find(x=>x.id===raceId);
const cl=c=>c==='-'?'u':c,name=id=>profiles.find(p=>p.id===id)?.name||'Unknown';
const hrs=(r,u)=>(AV[u]||'').padEnd(r.length_h,'-').slice(0,r.length_h);
const canLead=t=>isAdm()||t.leader_id===me.id;
const teamGeo=(r,t)=>{const t0=new Date(t.start_utc);return {t0,L:r.length_h,off:(t0-new Date(r.start_utc))/H}};
const avAt=(r,u,off,i)=>hrs(r,u)[Math.floor(i+off+1e-9)]||'-';
const stIdx=(s,t0)=>({a:Math.round((new Date(s.start_utc)-t0)/H),n:Math.round((new Date(s.end_utc)-new Date(s.start_utc))/H)});
const lim=p=>`${p.min_stint}–${p.max_stint}h stints · ${p.max_stints==null?'no max':'max '+p.max_stints} · ${p.min_rest_h??0}h rest`;
const teamName=id=>T.ts.find(t=>t.id===id)?.name||'another team';

function note(m,ok){
  if($('#dlg').open&&$('#dmsg')){$('#dmsg').textContent=m;return}
  const t=$('#toast');if(t){t.textContent=m;t.className=ok?'ok':'';t.hidden=!m;clearTimeout(tt);if(m)tt=setTimeout(()=>t.hidden=true,6000)}else if($('#msg'))$('#msg').textContent=m}
async function q(p){busy++;try{const r=await p;if(r.error){note(r.error.message);throw r.error}return r.data}finally{busy--}}

/* ---------- start / auth ---------- */
async function boot(){
  const {data}=await sb.auth.getSession();me=data.session?.user||null;
  sb.auth.onAuthStateChange((e,s)=>{const u=s?.user||null;if(u?.id!==me?.id){me=u;setTimeout(start,0)}});
  start();
}
async function start(){
  stopLive();
  if(!me)return loginView();
  const {data}=await sb.from('profiles').select('*').eq('id',me.id).maybeSingle();prof=data;
  // First login: take the time zone from this device instead of the UTC default.
  if(prof&&prof.tz==='UTC'&&DEV_TZ!=='UTC'){const r=await sb.from('profiles').update({tz:DEV_TZ}).eq('id',me.id).select().maybeSingle();if(!r.error&&r.data)prof=r.data}
  if(prof&&needsName())return nameView();
  if(!prof||!prof.approved)return pendingView();
  await loadBase();
  $('#app').innerHTML=`<header><b class="brand">ENDURANCE CREW</b><nav>
    <button data-v="my" onclick="go('my')">My races</button><button data-v="cal" onclick="go('cal')">Calendar</button><button data-v="roster" onclick="go('roster')">Roster</button></nav>
    <span class="grow"></span><span id="live" class="live" title="Connecting"><i></i><span>Connecting</span></span>
    <span class="mu">${esc(prof.name)} · ${esc(prof.tz)}${isAdm()?' · admin':''} · v${VERSION}</span><button class="ghost" onclick="sb.auth.signOut()">Sign out</button></header>
    <main><div id="tzb"></div><div id="main"></div></main><div id="toast" role="status" hidden></div>`;
  startLive();
  if(view==='race'&&!curRace())view='my';
  render();
}
async function loadBase(){
  [profiles,races]=await Promise.all([q(sb.from('profiles').select('*').eq('approved',true).order('name')),q(sb.from('races').select('*').order('start_utc'))]);
  const p=profiles.find(x=>x.id===me.id);if(p)prof=p;
}
function loginView(){
  $('#app').innerHTML=`<div class="auth"><h2>Sign in</h2><form onsubmit="return signin(event)"><label>Email<input id="em" type="email" required autocomplete="email"></label><label>Password<input id="pw" type="password" minlength="6" required autocomplete="current-password"></label><label>Your name (only for a new account)<input id="nm" maxlength="40" autocomplete="nickname" placeholder="e.g. George M."></label><div class="row"><button class="pri">Sign in</button><button type="button" onclick="signup()">Create account</button></div><p id="msg" class="mu" role="status"></p></form></div>`}
async function signin(e){e.preventDefault();const {error}=await sb.auth.signInWithPassword({email:$('#em').value,password:$('#pw').value});if(error)note(error.message);return false}
async function signup(){const f=$('.auth form');if(!f.reportValidity())return;const nm=$('#nm').value.trim();if(!nm){$('#nm').focus();return note('Enter your name to create an account. Your teammates see this name.')}
  const {error}=await sb.auth.signUp({email:$('#em').value,password:$('#pw').value,options:{data:{name:nm}}});note(error?error.message:'Account created. If email confirmation is on, confirm your email, then sign in. An admin must approve you before you see the schedule.')}
// Names that are still the email's first part (the old default) must be replaced once.
const needsName=()=>{const n=(prof.name||'').trim();return !n||(n===String(me.email||'').split('@')[0]&&store.get('nameok:'+me.id)!==n)};
function nameView(){$('#app').innerHTML=`<div class="auth"><h2>Pick your name</h2><p class="mu">This is the name your teammates see on the schedule. Your email isn’t shown.</p><form onsubmit="return saveName(event)"><label>Your name<input id="nm2" required maxlength="40" value="" placeholder="e.g. George M." autocomplete="nickname"></label><button class="pri">Continue</button><p id="msg" class="mu" role="status"></p></form></div>`}
async function saveName(e){e.preventDefault();const n=$('#nm2').value.trim();if(!n)return false;const r=await sb.from('profiles').update({name:n}).eq('id',me.id);if(r.error){note(r.error.message);return false}store.set('nameok:'+me.id,n);start();return false}
function pendingView(){$('#app').innerHTML=`<div class="auth"><h2>Waiting for approval</h2><p class="mu">Your account is created. An admin needs to approve it before you can see the schedule.</p><div class="row"><button class="pri" onclick="start()">Check again</button><button class="ghost" onclick="sb.auth.signOut()">Sign out</button></div></div>`}

/* ---------- live updates ---------- */
function startLive(){
  chan=sb.channel('ec-'+me.id).on('postgres_changes',{event:'*',schema:'public'},()=>{dirty=true;clearTimeout(rt);rt=setTimeout(refresh,700)})
   .subscribe(s=>{const el=$('#live');if(!el)return;const on=s==='SUBSCRIBED';el.classList.toggle('on',on);el.title=on?'Live: other drivers’ changes appear by themselves':'Not live: reload the page to see other drivers’ changes';el.lastChild.textContent=on?'Live':'Offline'});
}
function stopLive(){if(chan){sb.removeChannel(chan);chan=null}}
async function refresh(){
  if(!dirty)return;
  const typing=document.activeElement&&document.activeElement.matches('input,select,textarea')&&!$('#dlg').open;
  if(busy>0||$('#dlg').open||typing||$('#pf')?.dataset.changed){clearTimeout(rt);rt=setTimeout(refresh,1500);return}
  dirty=false;
  const {data}=await sb.from('profiles').select('*').eq('id',me.id).maybeSingle();
  if(!data||!data.approved){prof=data;return start()}
  prof=data;await loadBase();render();
}

/* ---------- navigation ---------- */
function go(v,id){view=v;raceId=id??null;window.scrollTo(0,0);render()}
async function render(){
  const key=view+'|'+raceId+'|'+sub,sx=key===lastKey?$$('.scroll').map(e=>e.scrollLeft):[];lastKey=key;
  $$('header nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===(view==='race'?'cal':view)));
  tzBanner();
  if(view==='my')await myView();else if(view==='cal')calView();else if(view==='race')await raceView();else await rosterView();
  $$('.scroll').forEach((e,i)=>{if(sx[i])e.scrollLeft=sx[i]});
}
function tzBanner(){
  const b=$('#tzb');if(!b)return;
  const show=DEV_TZ!==prof.tz&&store.get('tzkeep')!==DEV_TZ+'>'+prof.tz;
  b.innerHTML=show?`<div class="banner"><span class="grow">This device is set to <b>${esc(DEV_TZ)}</b>, but your profile says <b>${esc(prof.tz)}</b>.</span><button onclick="setTz('${esc(DEV_TZ)}')">Use ${esc(DEV_TZ)}</button><button class="ghost" onclick="keepTz()">Keep ${esc(prof.tz)}</button></div>`:''}
async function setTz(z){await q(sb.from('profiles').update({tz:z}).eq('id',me.id));prof.tz=z;await start()}
function keepTz(){store.set('tzkeep',DEV_TZ+'>'+prof.tz);tzBanner()}

/* ---------- dialog helpers ---------- */
function openDlg(html){const d=$('#dlg');d.innerHTML=html+'<div id="dmsg" role="alert"></div>';d.showModal()}
function closeDlg(){$('#dlg').close()}
$('#dlg').addEventListener('close',()=>{PLAN=null;if(dirty)refresh()});
const opt=(v,lab,sel)=>`<option value="${esc(v)}"${sel?' selected':''}>${esc(lab)}</option>`;

/* ---------- My races ---------- */
async function myView(){
  const now=Date.now(),tz=myTz();
  const [st,mm,av]=await Promise.all([q(sb.from('stints').select('*').eq('user_id',me.id).order('start_utc')),q(sb.from('team_members').select('*').eq('user_id',me.id)),q(sb.from('availability').select('*').eq('user_id',me.id))]);
  const tids=[...new Set([...st.map(s=>s.team_id),...mm.map(m=>m.team_id)])];
  const ts=tids.length?await q(sb.from('teams').select('*').in('id',tids)):[];
  const up=races.filter(r=>+new Date(r.start_utc)+r.length_h*H>now);
  const next=st.find(s=>new Date(s.end_utc)>now);
  const nextT=next&&ts.find(t=>t.id===next.team_id),nextR=nextT&&races.find(r=>r.id===nextT.race_id);
  const cards=up.map(r=>{
    const d=new Date(r.start_utc),a=av.find(x=>x.race_id===r.id),myTeams=ts.filter(t=>t.race_id===r.id);
    const moved=a&&r.start_changed_at&&(!a.updated_at||new Date(a.updated_at)<new Date(r.start_changed_at));
    const avChip=!a?'<span class="chip bad">Availability not set</span>':moved?'<span class="chip warn">Race moved: recheck availability</span>':'<span class="chip ok">Availability set</span>';
    const stl=st.filter(s=>myTeams.some(t=>t.id===s.team_id)).map(s=>{const t=myTeams.find(x=>x.id===s.team_id),m=mm.find(x=>x.team_id===t.id),n=Math.round((new Date(s.end_utc)-new Date(s.start_utc))/H);
      return `<div class="stint"><b>${locFull(new Date(s.start_utc),tz)}–${locH(new Date(s.end_utc),tz)}</b><span class="mu">${n}h · ${esc(t.name)} · ${esc(t.class)}${m?' · '+esc(m.car):''}</span><span class="chip ${s.status}">${s.status}</span></div>`}).join('');

/* ---------- Race ---------- */
async function loadRace(r){
  const [a,ts]=await Promise.all([q(sb.from('availability').select('*').eq('race_id',r.id)),q(sb.from('teams').select('*').eq('race_id',r.id).order('id'))]);
  AV={};AVT={};a.forEach(x=>{AV[x.user_id]=x.hours;AVT[x.user_id]=x.updated_at});
  const ids=ts.map(t=>t.id);
  const [ms,ss]=ids.length?await Promise.all([q(sb.from('team_members').select('*').in('team_id',ids)),q(sb.from('stints').select('*').in('team_id',ids).order('start_utc'))]):[[],[]];
  T={ts,ms,ss};
}
async function raceView(){
  const r=curRace();if(!r){view='cal';return calView()}
  await loadRace(r);
  const tz=myTz(),d=new Date(r.start_utc),e=new Date(+d+r.length_h*H);
  let ban='';
  if(r.start_changed_at&&AV[me.id]&&(!AVT[me.id]||new Date(AVT[me.id])<new Date(r.start_changed_at)))ban+=`<div class="banner warn">The race start was moved. Your ticked hours moved with it, so please check them on the Availability tab.</div>`;
  else if(!AV[me.id]&&e>Date.now())ban+=`<div class="banner">You haven’t set your availability for this race yet.</div>`;
  clockNotes(d,r.length_h).forEach(n=>ban+=`<div class="banner">${esc(n)}</div>`);
  $('#main').innerHTML=`<button class="ghost" onclick="go('cal')">Back to calendar</button>
    <div class="row" style="margin-top:10px"><h2 class="grow">${esc(r.name)} · ${r.length_h}H</h2>${isAdm()?`<button onclick="raceDlg(${r.id})">Edit race</button>`:''}</div>
    <div class="mu">${esc(r.track||'')}${r.track?' · ':''}${locFull(d,tz)} → ${locFull(e,tz)} your time · starts ${utcFull(d)}</div>${ban}
    <div class="tabs"><button class="${sub==='avail'?'on':''}" onclick="sub='avail';render()">Availability</button><button class="${sub==='teams'?'on':''}" onclick="sub='teams';render()">Team swimlanes</button></div><div id="sub"></div>`;
  sub==='avail'?drawAvail(r):drawTeams(r);
}

/* Availability grid: one box per hour, labelled in the viewer's own time. */
function drawAvail(r){
  const tz=myTz(),d=new Date(r.start_utc),L=r.length_h,cols=[...Array(L).keys()],mk=clockMarks(d,L,tz);let lastDay='';
  const head='<tr><th></th>'+cols.map(i=>{const t=new Date(+d+i*H),day=locDay(t,tz),show=day!==lastDay;lastDay=day;const m=mk[i];
    return `<th class="${m?'dst':''}" title="${range(t,1,tz)} your time · ${utcHM(t)}–${utcHM(new Date(+t+H))} UTC"><span class="day">${show?day:'&nbsp;'}</span>${locH(t,tz)}${m?`<span class="dstl">${m<0?'−':'+'}${Math.abs(m)/60}h</span>`:''}</th>`}).join('')+'</tr>';
  const body=profiles.map(p=>{const s=hrs(r,p.id),mine=p.id===me.id;
    return `<tr class="${mine?'me':''}"><td>${esc(p.name)}<div class="mu">${esc(p.tz)}</div><div class="mu">${lim(p)}</div></td>`+[...s].map((c,i)=>{const t=new Date(+d+i*H),tl=`${range(t,1,tz)}: ${WORD[c]}`;
      return `<td class="${mk[i]?'dst':''}">${mine?`<button class="cell ${cl(c)}" onclick="cyc(${r.id},${i})" title="${tl}" aria-label="${tl}"></button>`:`<span class="cell ${cl(c)}" title="${esc(p.name)} ${tl}"></span>`}</td>`}).join('')+'</tr>'}).join('');
  const cnt=cols.map(i=>{const a=profiles.filter(p=>hrs(r,p.id)[i]==='A').length,m=profiles.filter(p=>hrs(r,p.id)[i]==='M').length;
    return `<td class="n ${a?'':'zero'}" title="${a} available, ${m} maybe">${a}${m?`<span class="mu">+${m}</span>`:''}</td>`}).join('');
  $('#sub').innerHTML=`<div class="legend"><span class="chip approved">Available</span><span class="chip pending">Maybe</span><span class="chip bad">No</span><span class="chip dim">Not set</span>
    <span class="mu">Each box is 1 hour, shown in your time (${esc(tz)}). Tap your own boxes to change them.</span><span class="grow"></span><button onclick="fill(${r.id},'A')">All available</button><button onclick="fill(${r.id},'N')">All no</button></div>
    <div class="scroll"><table class="av"><thead>${head}</thead><tbody>${body}<tr><td><b>Available</b><div class="mu">+ maybe</div></td>${cnt}</tr></tbody></table></div>
    ${Object.keys(mk).length?'<p class="mu">The amber line marks where your clocks change.</p>':''}`;
}
async function saveAv(rid){AVT[me.id]=new Date().toISOString();await q(sb.from('availability').upsert({user_id:me.id,race_id:rid,hours:AV[me.id]}))}
async function cyc(rid,i){const r=races.find(x=>x.id===rid),s=[...hrs(r,me.id)];s[i]={'-':'A',A:'M',M:'N',N:'A'}[s[i]];AV[me.id]=s.join('');drawAvail(r);await saveAv(rid)}
async function fill(rid,c){const r=races.find(x=>x.id===rid);AV[me.id]=c.repeat(r.length_h);drawAvail(r);await saveAv(rid)}

/* ---------- Teams and stints ---------- */
function coverage(t,L,t0){const c=Array.from({length:L},()=>[]);T.ss.filter(s=>s.team_id===t.id).forEach(s=>{const {a,n}=stIdx(s,t0);for(let k=Math.max(0,a);k<Math.min(L,a+n);k++)c[k].push(s)});return c}
function gapRuns(c,t0,tz){const out=[];let i=0;while(i<c.length){if(!c[i].length){let j=i;while(j<c.length&&!c[j].length)j++;out.push(span(new Date(+t0+i*H),j-i,tz));i=j}else i++}return out}
function drawTeams(r){
  $('#sub').innerHTML=`<div class="row" style="margin-bottom:10px"><button class="pri" onclick="teamDlg()">New team</button><span class="mu">Tap an hour in your lane to request a stint. Tap a stint bar to change it.</span></div>`+
    (T.ts.map(t=>teamCard(r,t)).join('')||'<p class="mu">No teams yet. Each team gets its own swimlane chart with one lane per driver. Create a team, add drivers, then tap a lane to place stints.</p>');
}
function teamCard(r,t){
  const tz=myTz(),{t0,L,off}=teamGeo(r,t),lead=canLead(t),mem=T.ms.filter(m=>m.team_id===t.id),st=T.ss.filter(s=>s.team_id===t.id);
  const cov=coverage(t,L,t0),mk=clockMarks(t0,L,tz),lanes=mem.map(m=>({...m}));
  st.forEach(s=>{if(!lanes.some(l=>l.user_id===s.user_id))lanes.push({user_id:s.user_id,car:null,left:true})});
  if(!lanes.some(l=>l.user_id===me.id))lanes.push({user_id:me.id,car:null,ghost:true});
  let h=`<div class="who" style="grid-row:1;grid-column:1"></div>`+[...Array(L).keys()].map(i=>{const x=new Date(+t0+i*H);
    return `<div class="ax ${mk[i]?'dst':''}" style="grid-row:1;grid-column:${i+2}" title="${range(x,1,tz)} your time">${locH(x,tz)}${mk[i]?`<span class="dstl">${mk[i]<0?'−':'+'}${Math.abs(mk[i])/60}h</span>`:''}</div>`}).join('');
  h+=`<div class="who" style="grid-row:2;grid-column:1;min-height:0"><span class="mu">Coverage</span></div>`+cov.map((c,i)=>{const k=c.length>1?'x':c.length?(c.some(s=>s.status==='approved')?'ok':'p'):'gap';
    return `<div class="cov ${k}" style="grid-row:2;grid-column:${i+2}" title="${range(new Date(+t0+i*H),1,tz)}: ${COVW[k]}"></div>`}).join('');
  lanes.forEach((m,li)=>{const R=li+3,mine=m.user_id===me.id,click=mine||lead;
    const sub2=m.ghost?'Tap an hour to join':m.left?'Not in team':esc(m.car);
    h+=`<div class="who" style="grid-row:${R};grid-column:1">${m.ghost?`<b class="am">You</b>`:click?`<button class="${mine?'am':''}" onclick="memberDlg(${t.id},'${m.user_id}')" title="Car and team options">${esc(name(m.user_id))}</button>`:`<b>${esc(name(m.user_id))}</b>`}<span class="mu">${sub2}</span></div>`;
    for(let i=0;i<L;i++){const c=avAt(r,m.user_id,off,i),tl=`${range(new Date(+t0+i*H),1,tz)}: ${WORD[c]}`;
      h+=click?`<button class="h ${cl(c)}" style="grid-row:${R};grid-column:${i+2}" onclick="stintDlg(${t.id},0,'${m.user_id}',${i})" title="${tl}" aria-label="${esc(name(m.user_id))}, ${tl}"></button>`:`<div class="h ${cl(c)}" style="grid-row:${R};grid-column:${i+2}" title="${tl}"></div>`}
    st.filter(x=>x.user_id===m.user_id).forEach(x=>{const {a,n}=stIdx(x,t0),a2=Math.max(0,a),n2=Math.min(L,a+n)-a2;if(n2<=0)return;
      h+=`<button class="bar ${x.status}" style="grid-row:${R};grid-column:${a2+2}/span ${n2}" onclick="stintDlg(${t.id},${x.id})" title="${range(new Date(x.start_utc),n,tz)} · ${x.status}">${x.status==='pending'?'Pending · ':''}${n}h</button>`})});
  const gaps=gapRuns(cov,t0,tz),over=cov.some(c=>c.length>1);
  const list=st.map(x=>{const n=stIdx(x,t0).n;return `<tr><td>${esc(name(x.user_id))}</td><td>${locFull(new Date(x.start_utc),tz)}–${locH(new Date(x.end_utc),tz)}</td><td>${n}h</td><td><span class="chip ${x.status}">${x.status}</span></td><td><button class="ghost" onclick="stintDlg(${t.id},${x.id})">Open</button></td></tr>`}).join('');
  const free=profiles.filter(p=>!mem.some(m=>m.user_id===p.id));
  return `<div class="card"><div class="row"><b style="font-size:18px">${esc(t.name)}</b><span class="chip">${esc(t.class)}</span>
    <span class="mu grow">Leader: ${t.leader_id?esc(name(t.leader_id)):'none (admins manage it)'} · starts ${locFull(t0,tz)} your time</span>
    ${lead?`<button onclick="planDlg(${t.id})">Plan stints</button><button class="ghost" onclick="teamDlg(${t.id})">Edit team</button>`:''}</div>
    ${gaps.length?`<div class="banner warn">No driver: ${gaps.join(', ')}</div>`:`<div class="banner ok">Every hour has a driver.</div>`}${over?'<div class="banner warn">Some stints overlap (striped on the coverage line).</div>':''}
    <div class="scroll"><div class="tl" style="--L:${L}">${h}</div></div>
    <div class="legend"><span class="mu">Lanes:</span><span class="chip approved">Available</span><span class="chip pending">Maybe</span><span class="chip bad">No</span><span class="mu">Coverage:</span><span class="chip ok">Covered</span><span class="chip warn">Pending only</span><span class="chip bad">No driver</span></div>
    ${lead&&free.length?`<div class="form"><label>Add driver<select id="ad${t.id}">${free.map(p=>opt(p.id,p.name)).join('')}</select></label><label>Car<select id="ac${t.id}">${CARS[t.class].map(c=>opt(c,c)).join('')}</select></label><button onclick="addMember(${t.id})">Add to team</button></div>`:''}
    ${list?`<details><summary>Stint list (${st.length})</summary><div class="scroll"><table class="list"><tbody>${list}</tbody></table></div></details>`:''}</div>`;
}

function stintDlg(tid,sid,uid,start){

    ${!edit?'<p class="mu">This stint is approved. Ask the team leader to change it.</p>':''}

      ${s&&(lead||(own&&s.status==='pending'))?`<button type="button" class="danger" onclick="delStint(${s.id})">Remove stint</button>`:''}</div></form>`)}
async function saveStint(e,tid,sid){e.preventDefault();
  const f=new FormData(e.target),r=curRace(),t=T.ts.find(x=>x.id===tid),tz=myTz(),{t0,L,off}=teamGeo(r,t),lead=canLead(t);
  const uid=f.get('uid'),a=+f.get('a'),n=+f.get('n'),car=f.get('car'),p=profiles.find(x=>x.id===uid);
  if(a+n>L)return note('That stint runs past the end of the race. Pick an earlier start or a shorter stint.');
  const warn=[];
  if(p&&(n<p.min_stint||n>p.max_stint))warn.push(`${p.name}’s stint limits are ${p.min_stint}–${p.max_stint}h.`);
  {const A0=+t0+a*H,B0=A0+n*H,others=T.ss.filter(x=>x.user_id===uid&&x.id!==sid),rest=p?.min_rest_h??0;
   if(p&&p.max_stints!=null&&others.length+1>p.max_stints)warn.push(`${p.name} would have ${others.length+1} stints in this race (their max is ${p.max_stints}).`);
   if(rest)others.forEach(x=>{const xs=+new Date(x.start_utc),xe=+new Date(x.end_utc),g=xs>=B0?(xs-B0)/H:A0>=xe?(A0-xe)/H:-1;if(g>=0&&g<rest)warn.push(`${name(uid)} only gets ${g}h rest next to their ${locH(new Date(xs),tz)} stint (wants ${rest}h).`)})}
  const bad=[];for(let k=a;k<a+n;k++){const c=avAt(r,uid,off,k);if(c!=='A')bad.push(`${locH(new Date(+t0+k*H),tz)} ${WORD[c]}`)}
  if(bad.length)warn.push(`${name(uid)} isn’t marked available for: ${bad.join(', ')}.`);
  const A=new Date(+t0+a*H),B=new Date(+A+n*H);
  T.ss.filter(x=>x.id!==sid&&new Date(x.start_utc)<B&&new Date(x.end_utc)>A&&(x.team_id===tid||x.user_id===uid))
    .forEach(x=>warn.push(x.user_id===uid&&x.team_id!==tid?`${name(uid)} already drives for ${teamName(x.team_id)} then.`:`It overlaps ${name(x.user_id)}’s stint.`));
  if(warn.length&&!confirm(warn.join('\n')+'\n\nSave anyway?'))return;
  await q(sb.from('team_members').upsert({team_id:tid,user_id:uid,car}));
  const row={team_id:tid,user_id:uid,start_utc:A.toISOString(),end_utc:B.toISOString()};
  if(sid)await q(sb.from('stints').update(row).eq('id',sid));else await q(sb.from('stints').insert({...row,status:lead?'approved':'pending'}));
  closeDlg();render();note(sid?'Stint updated.':lead?'Stint added.':'Stint requested. The team leader will approve it.',1)}
async function appr(id){await q(sb.from('stints').update({status:'approved'}).eq('id',id));closeDlg();render()}
async function delStint(id){if(!confirm('Remove this stint?'))return;await q(sb.from('stints').delete().eq('id',id));closeDlg();render()}

/* ---------- Auto stint plan ----------
   Fills the hours that have no stint yet with 2–3h stints inside each driver's limits.
   Uses hours marked Available (preferred) or Maybe (avoided where possible), never hours
   a driver drives for another team. Avoids back-to-back stints by the same driver and
   spreads hours evenly. Existing stints are kept as they are. */
function makePlan(r,t){
  const {t0,L,off}=teamGeo(r,t),st=T.ss.filter(s=>s.team_id===t.id),mem=T.ms.filter(m=>m.team_id===t.id).map(m=>m.user_id),hr=x=>Math.round((new Date(x)-t0)/H);
  const cov=Array(L).fill(null);st.forEach(s=>{const {a,n}=stIdx(s,t0);for(let k=Math.max(0,a);k<Math.min(L,a+n);k++)cov[k]=s.user_id});
  const D=mem.map(uid=>{const p=profiles.find(x=>x.id===uid)||{},rest=p.min_rest_h??0,av=[...Array(L).keys()].map(i=>avAt(r,uid,off,i)),busy=Array(L).fill(false);
    const had=T.ss.filter(x=>x.user_id===uid); // this driver's stints in the whole race, any team, plus rest around them
    had.forEach(x=>{const a=hr(x.start_utc),b=hr(x.end_utc);for(let k=Math.max(0,a-rest);k<Math.min(L,b+rest);k++)busy[k]=true});
    return {uid,min:p.min_stint??2,max:p.max_stint??3,cap:p.max_stints==null?99:p.max_stints-had.length,rest,av,busy,none:!av.some(c=>c==='A'||c==='M')}});
  const U=D.filter(d=>!d.none&&d.cap>0),load0={};mem.forEach(u=>load0[u]=0);st.forEach(s=>load0[s.user_id]=(load0[s.user_id]||0)+stIdx(s,t0).n);
  const fair=l=>Object.values(l).reduce((a,x)=>a+x*x,0)*0.3,score=s=>s.cost+fair(s.load);
  const bk=Array.from({length:L+1},()=>[]);bk[0].push({last:null,load:load0,cnt:{},end:{},cost:0,steps:[]});
  for(let pos=0;pos<L;pos++){
    const seen=new Map();for(const s of bk[pos]){const k=s.last+'|'+mem.map(u=>`${s.load[u]||0}:${s.end[u]??''}`).join(',');const o=seen.get(k);if(!o||o.cost>s.cost)seen.set(k,s)}
    const b=[...seen.values()].sort((x,y)=>score(x)-score(y)).slice(0,300);
    for(const s of b){
      if(cov[pos]){let e=pos;while(e<L&&cov[e]===cov[pos])e++;bk[e].push({...s,last:cov[pos]});continue}
      for(const d of U){if((s.cnt[d.uid]||0)>=d.cap||(s.end[d.uid]!=null&&pos<s.end[d.uid]+d.rest))continue;
        for(const n of STINTS){if(n<d.min||n>d.max||pos+n>L)continue;let ok=true,mb=0;
          for(let k=pos;k<pos+n;k++){if(cov[k]||d.busy[k]||!(d.av[k]==='A'||d.av[k]==='M')){ok=false;break}if(d.av[k]==='M')mb++}
          if(!ok)continue;
          bk[pos+n].push({last:d.uid,load:{...s.load,[d.uid]:(s.load[d.uid]||0)+n},cnt:{...s.cnt,[d.uid]:(s.cnt[d.uid]||0)+1},end:{...s.end,[d.uid]:pos+n},
            cost:s.cost+1+mb*4+(d.uid===s.last?8:0),steps:[...s.steps,{uid:d.uid,a:pos,n,mb}]})}}
      bk[pos+1].push({...s,last:null,cost:s.cost+100,steps:[...s.steps,{gap:true,a:pos}]});
    }
  }
  const best=bk[L].sort((x,y)=>score(x)-score(y))[0]||{steps:[]};
  return {steps:best.steps.filter(x=>!x.gap),gaps:best.steps.filter(x=>x.gap).map(x=>x.a),skipped:D.filter(d=>d.none).map(d=>d.uid),full:D.filter(d=>!d.none&&d.cap<=0).map(d=>d.uid),mem,t0,L}
}
function planDlg(tid){
  const r=curRace(),t=T.ts.find(x=>x.id===tid),tz=myTz(),P=makePlan(r,t);
  if(!P.mem.length)return openDlg(`<form onsubmit="event.preventDefault();closeDlg()"><h3>Plan stints · ${esc(t.name)}</h3><p>Add drivers to the team first. The plan only uses drivers in this team.</p><div class="row"><button class="pri">OK</button></div></form>`);
  const runs=[];P.gaps.forEach(a=>{const l=runs[runs.length-1];if(l&&l.a+l.n===a)l.n++;else runs.push({a,n:1})});
  const rows=P.steps.map(s=>{const x=new Date(+P.t0+s.a*H);return `<tr><td><b>${esc(name(s.uid))}</b></td><td>${span(x,s.n,tz)}</td><td>${s.n}h</td><td>${s.mb?`<span class="chip warn">${s.mb}h maybe</span>`:''}</td></tr>`}).join('');
  openDlg(`<form onsubmit="applyPlan(event)"><h3>Plan stints · ${esc(t.name)}</h3>
    <p class="mu" style="margin:0">Fills empty hours using each driver’s availability, stint length, max stints and rest time. Existing stints stay as they are. Times are in your time zone.</p>
    ${rows?`<div class="scroll"><table class="plan"><tbody>${rows}</tbody></table></div>`:'<p>No new stints could be planned.</p>'}
    ${runs.length?`<div class="banner warn">Still no driver: ${runs.map(x=>span(new Date(+P.t0+x.a*H),x.n,tz)).join(', ')}. Nobody in the team can drive then (availability, rest time or max stints), or the gap is shorter than 2h.</div>`:''}
    ${P.skipped.length?`<p class="mu" style="margin:0">Left out (no availability set): ${P.skipped.map(u=>esc(name(u))).join(', ')}</p>`:''}${P.full.length?`<p class="mu" style="margin:0">Already at their max stints: ${P.full.map(u=>esc(name(u))).join(', ')}</p>`:''}
    <div class="row">${rows?`<button class="pri">Add ${P.steps.length} stints</button>`:''}<button type="button" onclick="closeDlg()">Cancel</button></div></form>`);
  PLAN={tid,...P};
}
async function applyPlan(e){e.preventDefault();if(!PLAN)return;const P=PLAN;
  await q(sb.from('stints').insert(P.steps.map(s=>({team_id:P.tid,user_id:s.uid,start_utc:new Date(+P.t0+s.a*H).toISOString(),end_utc:new Date(+P.t0+(s.a+s.n)*H).toISOString(),status:'approved'}))));
  closeDlg();render();note(`${P.steps.length} stints added. Tap any bar to adjust it.`,1)}

/* ---------- Roster ---------- */
async function rosterView(){
  const all=await q(sb.from('profiles').select('*').order('name')),adm=isAdm();
  let tzs=Intl.supportedValuesOf?Intl.supportedValuesOf('timeZone'):[];if(!tzs.includes(prof.tz))tzs=[prof.tz,...tzs];if(!tzs.includes('UTC'))tzs=['UTC',...tzs];
  const rows=all.map(p=>`<tr><td><b>${esc(p.name)}</b></td><td>${esc(p.tz)}</td><td class="mu">${lim(p)}</td><td><span class="chip ${p.approved?'approved':'pending'}">${p.approved?(p.role==='admin'?'admin':'driver'):'waiting'}</span></td>
    <td>${adm&&p.id!==me.id?(p.approved?`<button class="ghost" onclick="setUser('${p.id}',false,'driver')">Remove</button> <button class="ghost" onclick="setUser('${p.id}',true,'${p.role==='admin'?'driver':'admin'}')">${p.role==='admin'?'Make driver':'Make admin'}</button>`:`<button class="pri" onclick="setUser('${p.id}',true,'driver')">Approve</button>`):''}</td></tr>`).join('');
  $('#main').innerHTML=`<h2>Roster</h2><form id="pf" class="card form" onsubmit="saveProf(event)" oninput="this.dataset.changed=1" onchange="this.dataset.changed=1">
    <label>Your name<input name="name" required value="${esc(prof.name)}"></label>
    <label>Time zone<select name="tz">${tzs.map(z=>opt(z,z,z===prof.tz)).join('')}</select></label>
    <label>Min stint<select name="min">${STINTS.map(n=>opt(n,n+'h',n===prof.min_stint)).join('')}</select></label>
    <label>Max stint<select name="max">${STINTS.map(n=>opt(n,n+'h',n===prof.max_stint)).join('')}</select></label>
    <label>Max stints per race<select name="cnt">${opt('','No limit',prof.max_stints==null)}${[1,2,3,4,5,6,7,8].map(n=>opt(n,n,n===prof.max_stints)).join('')}</select></label>
    <label>Rest between stints<select name="rest">${[0,1,2,3,4,5,6,8].map(n=>opt(n,n+'h',n===(prof.min_rest_h??0))).join('')}</select></label>
    <button class="pri">Save profile</button>${DEV_TZ!==prof.tz?`<button type="button" onclick="this.form.tz.value='${esc(DEV_TZ)}';this.form.dataset.changed=1">Use this device’s zone (${esc(DEV_TZ)})</button>`:''}</form>
    <p class="mu">Your time zone is taken from your device on first login. Change it here if it’s wrong.</p>
    <div class="scroll"><table class="list"><tbody>${rows}</tbody></table></div>`}
async function saveProf(e){e.preventDefault();const f=new FormData(e.target);
  if(+f.get('min')>+f.get('max'))return note('Min stint can’t be longer than max stint.');
  await q(sb.from('profiles').update({name:f.get('name').trim(),tz:f.get('tz'),min_stint:+f.get('min'),max_stint:+f.get('max'),max_stints:f.get('cnt')===''?null:+f.get('cnt'),min_rest_h:+f.get('rest')}).eq('id',me.id));store.set('nameok:'+me.id,f.get('name').trim());
  delete e.target.dataset.changed;await start();note('Profile saved.',1)}
async function setUser(id,ok,role){await q(sb.rpc('set_user',{uid:id,ok,r:role}));await loadBase();render()}

boot();
